
name: Build Debug APK

# ---------------------------------------------------------------------------
# Oppo Cleaner — জিপ-ভিত্তিক বিল্ড
#
# এই ওয়ার্কফ্লো রিপোর রুটে রাখা oppo-cleaner-source.zip ফাইলটা নিজেই আনজিপ
# করে, তারপর Gradle দিয়ে debug APK বানায়। তাই মোবাইল ব্রাউজার থেকে শুধু
# জিপটা আপলোড করলেই কাজ চলে — গোটা ফোল্ডার আপলোড করার দরকার নেই।
#
# রাখার জায়গা:  .github/workflows/build-apk.yml
# ---------------------------------------------------------------------------

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip source archive
        run: |
          set -euo pipefail
          ZIP="$(ls -1 *.zip 2>/dev/null | head -1 || true)"
          if [ -z "$ZIP" ]; then
            echo "::error::রিপোর রুটে কোনো .zip ফাইল পাওয়া যায়নি। oppo-cleaner-source.zip আপলোড করুন।"
            exit 1
          fi
          echo "Found archive: $ZIP"
          unzip -q -o "$ZIP" -d _src
          echo "--- extracted tree (2 levels) ---"
          find _src -maxdepth 2 | head -40

          if [ -x "_src/oppo-cleaner/gradlew" ] || [ -f "_src/oppo-cleaner/gradlew" ]; then
            SRC="_src/oppo-cleaner"
          else
            SRC="$(find _src -maxdepth 3 -name gradlew -printf '%h\n' | head -1)"
          fi

          if [ -z "${SRC:-}" ] || [ ! -f "$SRC/gradlew" ]; then
            echo "::error::আনজিপ করা ফোল্ডারে gradlew পাওয়া যায়নি — জিপটা অসম্পূর্ণ হতে পারে।"
            exit 1
          fi
          echo "SRC_DIR=$SRC" >> "$GITHUB_ENV"
          echo "Source directory: $SRC"
          ls -la "$SRC"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform and build-tools
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build debug APK
        run: |
          set -euo pipefail
          cd "$SRC_DIR"
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: oppo-cleaner-debug-apk
          path: ${{ env.SRC_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90
